# Alembic: database migrations.

#   uv run alembic upgrade head        apply all migrations

#   uv run alembic revision -m "..."   create a new migration file

#

# The database URL is NOT stored here; migrations/env.py reads it from

# RATEKEEPER_DATABASE_URL (same setting the app uses).


 

[alembic]

script_location = %(here)s/migrations

prepend_sys_path = src


 

[loggers]

keys = root,alembic


 

[handlers]

keys = console


 

[formatters]

keys = generic


 

[logger_root]

level = WARNING

handlers = console


 

[logger_alembic]

level = INFO

handlers =

qualname = alembic


 

[handler_console]

class = StreamHandler

args = (sys.stderr,)

formatter = generic


 

[formatter_generic]

format = %(levelname)-5.5s [%(name)s] %(message)s


 