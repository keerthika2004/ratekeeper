# Lint, type-check and run every test (unit + integration) on each push and PR.
# GitHub's Ubuntu runners have Docker, so Testcontainers can start the real
# Redis and Postgres the integration tests need.
name: ci

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v6
      - run: uv python install 3.12
      - run: uv sync
      - name: Lint
        run: uv run ruff check
      - name: Type-check
        run: uv run mypy
      - name: Tests (unit + integration)
        run: uv run pytest
